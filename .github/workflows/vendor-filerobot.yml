name: Vendor Filerobot Image Editor

on:
  push:
    paths:
      - '.github/workflows/vendor-filerobot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bar Tadeo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build official Filerobot v4.9.1 bundle
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v4.9.1 https://github.com/scaleflex/filerobot-image-editor.git /tmp/filerobot-image-editor
          cd /tmp/filerobot-image-editor
          corepack enable
          yarn install --frozen-lockfile
          yarn build:js-bundle

      - name: Vendor bundle, license and provenance
        shell: bash
        run: |
          set -euo pipefail
          VENDOR_DIR='public/assets/vendor/filerobot-image-editor'
          mkdir -p "$VENDOR_DIR"
          cp /tmp/filerobot-image-editor/dist/filerobot-image-editor.min.js "$VENDOR_DIR/"
          cp /tmp/filerobot-image-editor/LICENSE "$VENDOR_DIR/LICENSE"
          UPSTREAM_COMMIT="$(git -C /tmp/filerobot-image-editor rev-parse HEAD)"
          cat > "$VENDOR_DIR/VERSION.txt" <<EOF
          Filerobot Image Editor
          Upstream repository: https://github.com/scaleflex/filerobot-image-editor
          Upstream tag: v4.9.1
          Upstream commit: ${UPSTREAM_COMMIT}
          Build command: yarn build:js-bundle
          License: MIT (see LICENSE)
          EOF
          (
            cd "$VENDOR_DIR"
            sha256sum filerobot-image-editor.min.js LICENSE VERSION.txt > SHA256SUMS
          )

      - name: Verify vendored bundle
        shell: bash
        run: |
          set -euo pipefail
          VENDOR_DIR='public/assets/vendor/filerobot-image-editor'
          test -s "$VENDOR_DIR/filerobot-image-editor.min.js"
          test -s "$VENDOR_DIR/LICENSE"
          test -s "$VENDOR_DIR/VERSION.txt"
          test -s "$VENDOR_DIR/SHA256SUMS"
          grep -q 'FilerobotImageEditor' "$VENDOR_DIR/filerobot-image-editor.min.js"
          (cd "$VENDOR_DIR" && sha256sum -c SHA256SUMS)

      - name: Commit vendored files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/vendor/filerobot-image-editor
          if git diff --cached --quiet; then
            echo 'Vendored files already match; nothing to commit.'
            exit 0
          fi
          git commit -m 'Vendor Filerobot Image Editor v4.9.1'
          git push origin HEAD:main
