name: Editor Integration Check

on:
  push:
    paths:
      - '.github/workflows/editor-integration-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l public/tadeo-admin/product-create.php
          php -l public/tadeo-admin/product-edit.php
          php -l public/includes/upload.php
      - name: JavaScript syntax
        run: |
          node --check public/assets/js/product-image-preview.js
          node --check public/assets/js/product-image-editor.js
      - name: Verify local editor assets and integration hooks
        run: |
          test -s public/assets/vendor/filerobot-image-editor/filerobot-image-editor.min.js
          test -s public/assets/vendor/filerobot-image-editor/LICENSE
          grep -q 'data-product-image-editor-root' public/tadeo-admin/product-create.php
          grep -q 'data-product-image-editor-root' public/tadeo-admin/product-edit.php
          grep -q 'value="auto" data-image-mode' public/tadeo-admin/product-create.php
          grep -q 'value="edit" data-image-mode' public/tadeo-admin/product-create.php
          grep -q 'product-image-validation' public/assets/js/product-image-preview.js
          grep -q 'FilerobotImageEditor' public/assets/js/product-image-editor.js
