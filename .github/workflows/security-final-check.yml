name: Security Final Check

on:
  push:
    paths:
      - '.github/workflows/security-final-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l public/includes/security_guard.php
          php -l public/includes/db.php
          php -l public/includes/auth.php
          php -l public/tadeo-admin/login.php
      - name: Shell syntax
        run: bash -n scripts/preflight.sh
      - name: Verify security constants and hooks
        run: |
          grep -q 'SITE_IP_GUARD_MAX_FAILED_LOGINS = 15' public/includes/security_guard.php
          grep -q 'SITE_IP_GUARD_BLOCK_HOURS = 24' public/includes/security_guard.php
          grep -q 'site_ip_guard_enforce(db())' public/includes/db.php
          grep -q 'site_ip_guard_register_failed_login' public/includes/auth.php
          grep -q 'login_dummy_password_check' public/tadeo-admin/login.php
          php -r 'var_export(password_verify("password", "$2y$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2uheWG/igi.")); echo PHP_EOL;'
